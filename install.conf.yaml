- defaults:
    link:
      relink: true
    shell:
      stderr: true
      stdout: true

- clean: ["~"]

- link:
    # ~/.zshrc: shell/zshrc
    # ~/.zsh_plugins.txt: shell/zshplugins
    # ~/.oh-my-posh.yaml: shell/oh-my-posh.yaml

    ~/.tmux.conf: shell/tmux.conf

    ~/.vimrc: vimrc
    ~/.xdg/nvim:
      path: nvim/
      create: true
    ~/.vimrc.coc: vimrc.coc
    ~/.vimrc.dap: vimrc.dap
    ~/.vim/coc-settings.json:
      path: coc-settings.json
      create: true
    # "~/Library/Application Support/Code/User/settings.json":
    #   path: vscode/settings.json
    #   create: true
    #   force: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [brew install jandedobbeleer/oh-my-posh/oh-my-posh, Installing oh my posh]
    - [
        "[ -d shell ] && git clone https://github.com/dracula/iterm.git ~/iterm2-dracula",
        Installing Dracula theme for iTerm2,
      ]

    #- [bash -c "vscode/install_extensions.sh", Installing VSCode extensions]
