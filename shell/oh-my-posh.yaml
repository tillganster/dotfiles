# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
palette:
  green: "#50fa7b"
  dark_bg: "#282a36"
  dark_violet: "#44475a"
  light_grey: "#f8f8f2"
  mid_violet: "#6272a4"
  cyan: "#8be9fd"
  orange: "#ffb86c"
  pink: "#ff79c6"
  purple: "#bd93f9"
  red: "#ff5555"
  yellow: "#f1fa8c"

blocks:
  - type: prompt
    alignment: left
    segments:
      # - properties:
      #     template: '{{ .UserName }} '
      #   leading_diamond: x
      #   foreground: '#ffffff'
      #   background: '#6272a4'
      #   type: session
      #   style: diamond
      - type: os
        style: plain
        foreground: "p:purple"
        background: "transparent"
      - properties:
          style: powerlevel
        foreground: "p:light_grey"
        powerline_symbol: 
        background: "#bd93f9"
        type: path
      - type: git
        style: powerline
        powerline_symbol: 
        foreground: "#193549"
        background: "#50fa7b"
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#f1fa8c{{ end }}"

        # background_templates:
        #   - "{{ if gt .Ahead 0 }}#f1fa8c{{ end }}"
        #   - "{{ if gt .Behind 0 }}#f1fa8c{{ end }}"
        #   - ”{{if or (.Working.Changed) (.Staging.Changed) }}#bd93f9{{ end }}”
        # - "{{ if or (.Working.Changed) (.Staging.Changed) }}#FFEB3B{{ end }}"
        # - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#50FA7B{{ end }}"

        # "template": "{{ .UpstreamIcon }} | {{ .Ref }} {{ .BranchStatus }}{{ if .Working.Changed }} \uF044 {{ .Working.String }}{{ end }}{{ if and (.Staging.Changed) (.Working.Changed) }} |{{ end }}{{ if .Staging.Changed }} \uF046 {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0}} \uF692 {{ .StashCount }}{{ end }}{{ if gt .WorktreeCount 0}} \uf1bb {{ .WorktreeCount }}{{ end }}"

        properties:
          fetch_status: true
          fetch_upstream_icon: true
          untracked_modes:
            /Users/user/Projects/oh-my-posh/: no
          source: cli
          mapped_branches:
            feat/*: "🚀 "
            bug/*: "🐛 "
      - template: "  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} "
        foreground: "#ffffff"
        powerline_symbol: 
        background: "#8be9fd"
        type: node
        style: powerline
      - properties:
          time_format: "15:04"
        template: " ♥ {{ .CurrentDate | date .Format }} "
        trailing_diamond: 
        foreground: "#ffffff"
        background: "#ff79c6"
        type: time
        style: diamond

version: 3
final_space: true
