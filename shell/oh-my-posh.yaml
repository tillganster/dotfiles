# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
palette:
  green: "#50fa7b"
  dark_bg: "#282a36"
  dark_violet: "#44475a"
  light_grey: "#f8f8f2"
  mid_violet: "#6272a4"
  cyan: "#8be9fd"
  orange: "#ffb86c"
  pink: "#ff79c6"
  purple: "#bd93f9"
  red: "#ff5555"
  yellow: "#f1fa8c"

blocks:
  - type: prompt
    alignment: left
    segments:
      # - properties:
      #     template: '{{ .UserName }} '
      #   leading_diamond: x
      #   foreground: '#ffffff'
      #   background: '#6272a4'
      #   type: session
      #   style: diamond
      - type: os
        style: plain
        foreground: "p:purple"
        background: "transparent"
      - properties:
          style: powerlevel
        foreground: "p:light_grey"
        powerline_symbol: 
        background: "#bd93f9"
        type: path
        style: powerline
      - type: git
        style: powerline
        powerline_symbol: 
        #foreground: "#1E1E2E"
        #background: "#A6E3A1"
        
        background_templates:
          - "{{ if .UpstreamGone }}#F38BA8{{ end }}"
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}p:yellow{{ end }}"
          - "{{ if gt .Staging.Unmerged 0 }}p:orange{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#FAB387{{ end }}"
          - "{{ if gt .Ahead 0 }}#CBA6F7{{ end }}"
          - "{{ if gt .Behind 0 }}#89B4FA{{ end }}"
        
        template: >-
          {{ " " }}{{ .UpstreamIcon }} {{ .HEAD }}        
        properties:
          branch_icon: " "
          branch_identical_icon: ≡
          branch_ahead_icon: ↑
          branch_behind_icon: ↓
          branch_gone_icon: ≢
          commit_icon: " "
          tag_icon: " "
          rebase_icon: " "
          cherry_pick_icon: " "
          revert_icon: " "
          merge_icon: " "
          no_commits_icon: "󰜄 "
          github_icon: " "
          gitlab_icon: " "
          bitbucket_icon: " "
          azure_devops_icon: " "
          git_icon: " "   
version: 3
final_space: true
