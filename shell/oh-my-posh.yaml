# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

blocks:
  - type: prompt
    alignment: left
    segments:
      # - properties:
      #     template: '{{ .UserName }} '
      #   leading_diamond: x
      #   foreground: '#ffffff'
      #   background: '#6272a4'
      #   type: session
      #   style: diamond
      - properties:
          style: folder
          template: " {{ .Path }} "
        foreground: "#ffffff"
        powerline_symbol: 
        background: "#bd93f9"
        type: path
        style: powerline
      - type: git
        style: powerline
        powerline_symbol: 
        foreground: "#193549"
        background: "#50fa7b"
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#FFEB3B{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#50FA7B{{ end }}"
          - "{{ if gt .Ahead 0 }}#B388FF{{ end }}"
          - "{{ if gt .Behind 0 }}#B388FB{{ end }}"
        "template": "{{ .UpstreamIcon }} | {{ .Ref }} {{ .BranchStatus }}{{ if .Working.Changed }} \uF044 {{ .Working.String }}{{ end }}{{ if and (.Staging.Changed) (.Working.Changed) }} |{{ end }}{{ if .Staging.Changed }} \uF046 {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0}} \uF692 {{ .StashCount }}{{ end }}{{ if gt .WorktreeCount 0}} \uf1bb {{ .WorktreeCount }}{{ end }}"

        properties:
          fetch_status: true
          fetch_upstream_icon: true
          untracked_modes:
            /Users/user/Projects/oh-my-posh/: no
          source: cli
          mapped_branches:
            feat/*: "🚀 "
            bug/*: "🐛 "
      - template: "  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} "
        foreground: "#ffffff"
        powerline_symbol: 
        background: "#8be9fd"
        type: node
        style: powerline
      - properties:
          time_format: "15:04"
        template: " ♥ {{ .CurrentDate | date .Format }} "
        trailing_diamond: 
        foreground: "#ffffff"
        background: "#ff79c6"
        type: time
        style: diamond

version: 3
final_space: true
